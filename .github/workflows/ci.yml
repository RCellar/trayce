name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  # pull_request always runs CI. The ruleset on main requires the
  # `ci (ubuntu-latest)` and `ci (windows-latest)` contexts to pass, and
  # paths-ignore here would make those contexts never fire for docs-only PRs —
  # deadlocking the merge. CI on post-merge pushes to main still skips
  # docs-only commits via the `push` paths-ignore above, so we pay the CI cost
  # at most once per docs-only change rather than twice.
  pull_request:

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Get Playwright version
        id: playwright-version
        shell: bash
        run: |
          version=$(grep -oE '"playwright":\s*"[0-9]+\.[0-9]+\.[0-9]+"' package.json | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ matrix.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright system deps (Linux cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true' && runner.os == 'Linux'
        run: bunx playwright install-deps chromium

      - name: Lint
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build client
        run: bun run build:client
