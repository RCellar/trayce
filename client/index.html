<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>trayce</title>
  <script>
    try {
      const saved = localStorage.getItem("trayce-theme");
      if (saved) {
        const t = JSON.parse(saved);
        const r = document.documentElement.style;
        if (t.vars) for (const [k, v] of Object.entries(t.vars)) r.setProperty(k, v);
      }
    } catch {}
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Top Bar -->
  <header id="top-bar">
    <div class="left">
      <span class="logo">trayce</span>
      <span id="canvas-info" class="info"></span>
    </div>
    <div class="right">
      <span id="tool-info"></span>
      <span id="layer-info"></span>
      <span id="gear-container"></span>
    </div>
  </header>

  <!-- Main Area -->
  <div id="main">
    <!-- Left Toolbar -->
    <aside id="toolbar"></aside>

    <!-- Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Side Panel (response + transcript) -->
    <aside id="side-panel"></aside>
  </div>

  <!-- Bottom Bar -->
  <footer id="bottom-bar">
    <div class="bar-row bar-status">
      <span id="connection-status" class="status disconnected">
        <span class="dot"></span>
        <span class="text">Disconnected</span>
      </span>
      <label class="session-label">
        <select id="session-select" disabled>
          <option value="">No sessions</option>
        </select>
      </label>
    </div>
    <div class="bar-row bar-prompt">
      <div class="prompt-container">
        <input type="text" id="prompt-input" placeholder="Describe what you want...">
        <button type="button" id="submit-btn" disabled>Send</button>
      </div>
    </div>
  </footer>

  <div id="toast-container"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
